<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="body-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.9 -0.3"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece0cc" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#ece0cc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="182" y="212" width="660" height="600" rx="46"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1d1915" filter="url(#body-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#highlight)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ece0cc" stroke-opacity="0.14" stroke-width="3"/>

  <g transform="rotate(-4 512 512)">
    <rect x="182" y="212" width="660" height="600" rx="46" fill="#f4ede1" filter="url(#card-shadow)"/>
    <g clip-path="url(#card-clip)">
      <rect x="182" y="212" width="660" height="600" fill="#f4ede1" filter="url(#grain)" opacity="0.5"/>
    </g>

    <g fill="#c6b8a3" fill-opacity="0.6">
      <rect x="392" y="406" width="390" height="76" rx="38"/>
      <rect x="392" y="528" width="390" height="76" rx="38"/>
      <rect x="392" y="650" width="390" height="76" rx="38"/>
    </g>

    <circle cx="330" cy="322" r="34" fill="#60754a"/>
    <rect x="392" y="284" width="390" height="76" rx="38" fill="#60754a"/>

    <path d="M222 396 L286 444 L222 492 Z" fill="#b8532b" stroke="#b8532b" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="330" cy="444" r="34" fill="#a87410"/>
    <rect x="392" y="406" width="273" height="76" rx="38" fill="#a87410"/>

    <circle cx="330" cy="566" r="34" fill="#993a50"/>
    <rect x="392" y="528" width="137" height="76" rx="38" fill="#993a50"/>

    <circle cx="330" cy="688" r="34" fill="#c6b8a3"/>
  </g>
</svg>
